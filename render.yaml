# render.yaml
# Blueprint version: 1
#
# Render Infrastructure as Code
# Deploy with: render deploy --config render.yaml
# Or connect repo at https://dashboard.render.com and Render will auto-detect this file

services:
  # Backend API (uses npm)
  - type: web
    name: printloop-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: 01-backend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: printloop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: printloop-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RENDER_CALLBACK_SECRET
        generateValue: true
      - key: COMMISSION_PCT_DEFAULT
        value: "0.10"
      - key: SEED_DEMO
        value: "1"

  # Frontend - Static Site (uses pnpm)
  - type: static
    name: printloop-frontend
    plan: free
    rootDir: printloop-new-frontend
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        value: "https://printloop-api.onrender.com/api"
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false

  # Render Worker (uses npm)
  - type: web
    name: printloop-render-worker
    runtime: node
    plan: free
    region: frankfurt
    rootDir: render-worker
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: printloop-redis
          property: connectionString
      - key: RENDER_CALLBACK_SECRET
        fromService:
          type: web
          name: printloop-api
          envVarKey: RENDER_CALLBACK_SECRET
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: RENDER_DEFAULT_DPI
        value: "300"
      - key: RENDER_MAX_DPI
        value: "600"
      - key: RENDER_TEMP_DIR
        value: "/tmp/printloop-render"
      - key: PRINTLOOP_API_URL
        fromService:
          type: web
          name: printloop-api
          property: hostport
      - key: METRICS_PORT
        value: "9091"

  # Redis for BullMQ + caching
  - type: redis
    name: printloop-redis
    plan: free
    ipAllowList: []

databases:
  # PostgreSQL database
  - name: printloop-db
    databaseName: printloop
    user: printloop
    plan: free
    region: frankfurt
    postgresMajorVersion: 16