# Fly.io configuration for PrintLoop SaaS v2
# Deploy with: flyctl deploy

app = "printloop-api"
primary_region = "iad"

[build]
  dockerfile = "01-backend/Dockerfile.prod"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DB_SSL = "true"
  LOG_LEVEL = "info"
  LOG_PRETTY = "false"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Separate worker process
[processes]
  app = "node dist/server.js"
  worker = "node dist/worker.js"

# Persistent volume for SQLite (if not using managed Postgres)
# [mounts]
#   source = "printloop_data"
#   destination = "/app/data"

# Health checks
[health_checks]
  interval = "30s"
  timeout = "10s"
  grace_period = "20s"