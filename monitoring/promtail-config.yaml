# Promtail — ships pino JSON logs to Loki for the Grafana dashboard
# (V2-36, see OBSERVABILITY.md). Copy to your log shipper host, edit
# `clients[0].url` and any source paths to match your deployment.
#
# Run with:
#   docker run -d --name=promtail \
#     -v /var/log:/var/log \
#     -v $(pwd)/monitoring/promtail-config.yaml:/etc/promtail/config.yaml \
#     grafana/promtail:latest -config.file=/etc/promtail/config.yaml
#
# What it does:
#   - Tails the pino stdout of the api, worker, and render-worker
#     containers (via Docker's JSON log driver) OR direct files
#     under /var/log/printloop/*.log if you log to disk
#   - Parses each JSON line into labels (svc, level, requestId,
#     tenantId, path, status)
#   - Lifts `tenantId` into a Loki label so queries like
#     `{svc="printloop-api",tenantId="a4f5b02b..."}` are fast
#   - Drops the noisy `request` lines (the bulk of traffic) below
#     INFO to keep storage manageable

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # ── Point this at your Loki host ──────────────────────────────────
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Path 1: Docker JSON log driver ────────────────────────────────
  # Use this when the api / worker / render-worker run as containers.
  - job_name: printloop-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.service=printloop-api']
          - name: label
            values: ['com.docker.compose.service=printloop-worker']
          - name: label
            values: ['com.docker.compose.service=printloop-render-worker']
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'svc'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
    pipeline_stages:
      # Each line from the Docker JSON driver is itself JSON; the
      # `log` field contains the pino JSON line. Parse twice.
      - docker: {}
      - json:
          expressions:
            level: level
            time: time
            svc: svc
            requestId: requestId
            tenantId: tenantId
            method: method
            path: path
            status: status
            durationMs: durationMs
            msg: msg
      - labels:
          level:
          svc:
          tenantId:
      # Use the pino timestamp, not the Docker read time, so the
      # Grafana time slider matches what actually happened.
      - timestamp:
          source: time
          format: RFC3339Nano

  # ── Path 2: Plain log files ───────────────────────────────────────
  # Use this when the api writes pino JSON to disk via stdout
  # redirection (e.g. systemd journal export, or `npm start >> log`).
  - job_name: printloop-files
    static_configs:
      - targets: [localhost]
        labels:
          job: printloop-files
          __path__: /var/log/printloop/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            svc: svc
            requestId: requestId
            tenantId: tenantId
            method: method
            path: path
            status: status
            durationMs: durationMs
            msg: msg
      - labels:
          level:
          svc:
          tenantId:
      - timestamp:
          source: time
          format: RFC3339Nano
