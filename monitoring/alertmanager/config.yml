global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@printloop.app'
  smtp_auth_username: 'alerts@printloop.app'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # Slack notifications
  slack_api_url: 'https://hooks.slack.com/services/${SLACK_WEBHOOK_URL}'
  slack_channel: '#alerts'
  send_resolved: true

  # PagerDuty integration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  pagerduty_routing_key: '${PAGERDUTY_ROUTING_KEY}'

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts go to PagerDuty immediately
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    # Warnings go to Slack
    - match:
        severity: warning
      receiver: 'slack-warnings'
      continue: true

    # Critical alerts also go to Slack
    - match:
        severity: critical
      receiver: 'slack-critical'

    # Default route
    receiver: 'default'

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@printloop.app'
        send_resolved: true
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: 'PrintLoop Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          {{ end }}

  - name: 'slack-critical'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Component:* {{ .Labels.component }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: 'slack-warnings'
    slack_configs:
      - channel: '#alerts-warnings'
        send_resolved: true
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_INTEGRATION_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }} - {{ .Annotations.summary }}'
        details:
          service: '{{ .Labels.service }}'
          component: '{{ .Labels.component }}'
          runbook: '{{ .Annotations.runbook_url }}'

  - name: 'pagerduty-warning'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_INTEGRATION_KEY}'
        severity: warning
        description: '{{ .GroupLabels.alertname }} - {{ .Annotations.summary }}'
        details:
          service: '{{ .Labels.service }}'
          component: '{{ .Labels.component }}'
          runbook: '{{ .Annotations.runbook_url }}'