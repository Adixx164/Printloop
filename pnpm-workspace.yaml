packages:
  - "packages/*"
  - "printloop-new-frontend"
  - "01-backend"
  - "render-worker"
  - "printloop-agent"

allowBuilds:
  '@sentry/node-cpu-profiler': true
  better-sqlite3: true
  electron: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: true
  sharp: true
  sqlite3: true
  usb: true

catalog:
  # Core dependencies
  react: ^18.3.1
  "react-dom": ^18.3.1
  "react-router-dom": ^6.23.1
  "@reduxjs/toolkit": ^2.2.3
  "react-redux": ^9.1.2
  typescript: ^5.4.5
  
  # Build tools
  vite: ^5.3.1
  "@vitejs/plugin-react": ^4.3.1
  electron: ^28.2.0
  "electron-builder": ^24.13.3
  "electron-updater": ^6.1.8
  
  # Expo
  expo: ~50.0.0
  "expo-router": ~3.4.0
  "expo-notifications": ~0.27.0
  "expo-sqlite": ~13.0.0
  "expo-task-manager": ~11.0.0
  "expo-background-fetch": ~11.0.0
  "expo-secure-store": ~12.0.0
  "expo-constants": ~15.0.0
  "expo-linking": ~6.0.0
  "expo-dev-client": ~3.0.0
  
  # Socket.io
  "socket.io": ^4.7.4
  "socket.io-client": ^4.7.4
  
  # Database
  sqlite3: ^5.1.7
  
  # Printer
  usb: ^2.14.0
  "ipp-printer": ^1.0.0
  "bonjour-service": ^1.2.0
  
  # Utils
  "@aws-sdk/client-s3": ^3.1121.0
  "@aws-sdk/s3-request-presigner": ^3.1121.0
  "pdf-lib": ^1.17.1
  qrcode: ^1.5.4
  "lucide-react": ^0.400.0
  sonner: ^1.5.0
  
  # Dev dependencies
  "@types/node": ^20.14.10
  "@types/react": ^18.3.3
  "@types/react-dom": ^18.3.0
  "@types/sqlite3": ^3.1.11
  "@types/usb": ^2.0.0
  "@types/qrcode": ^1.5.6
  vitest: ^2.1.9
  tsx: ^4.22.3