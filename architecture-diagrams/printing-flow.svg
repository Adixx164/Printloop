<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1420" viewBox="0 0 800 1420">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A1410"/>
    </marker>
  </defs>
  <rect width="800" height="1420" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Fraunces, serif" font-size="24" fill="#D14B2C" font-weight="700">PrintLoop — Printing Flow</text>
  <line x1="100" y1="55" x2="700" y2="55" stroke="#1A1410" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="240" y="80" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Customer Opens App</text>
  <rect x="240" y="150" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Map Shows Nearby Print Shops</text>
  <rect x="240" y="220" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
