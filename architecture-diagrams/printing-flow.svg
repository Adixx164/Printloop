  <line x1="400" y1="710" x2="400" y2="730" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="400,730 480,755 400,780 320,755" fill="#F5E0D8" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="760" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Satisfied?</text>
  <line x1="320" y1="755" x2="230" y2="615" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="283.0" y="681.0" font-family="Inter, sans-serif" font-size="13" fill="#1A1410" font-weight="600">No</text>
  <line x1="400" y1="780" x2="400" y2="830" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="408.0" y="801.0" font-family="Inter, sans-serif" font-size="13" fill="#1A1410" font-weight="600">Yes</text>
  <rect x="240" y="830" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="860" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Pay Online</text>
  <rect x="240" y="900" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="930" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Get Authentication Code</text>
  <rect x="240" y="970" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1000" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Order Sent to Shop</text>
  <rect x="240" y="1040" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1070" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Shop Prints Job</text>
  <rect x="240" y="1110" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1140" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Job Ready for Pickup</text>
  <rect x="240" y="1180" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Customer Shows Auth Code</text>
  <rect x="240" y="1250" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1280" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Shop Verifies & Hands Over</text>
  <rect x="240" y="1320" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="1350" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Done</text>
  <line x1="400" y1="880" x2="400" y2="900" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="950" x2="400" y2="970" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="1020" x2="400" y2="1040" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="1090" x2="400" y2="1110" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="1160" x2="400" y2="1180" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="1230" x2="400" y2="1250" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="1300" x2="400" y2="1320" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>