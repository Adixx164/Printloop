  <rect x="240" y="360" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1410" font-weight="600">Choose Print Mode</text>
