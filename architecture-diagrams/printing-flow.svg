  <line x1="400" y1="200" x2="400" y2="220" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="270" x2="400" y2="290" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="340" x2="400" y2="360" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="410" x2="400" y2="430" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="80" y="430" width="200" height="40" rx="8" fill="#FFF8F0" stroke="#1A1410" stroke-width="2"/>
  <text x="180" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1410" font-weight="600">Single</text>
  <rect x="300" y="430" width="200" height="40" rx="8" fill="#FFF8F0" stroke="#1A1410" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1410" font-weight="600">Batch</text>
  <rect x="520" y="430" width="200" height="40" rx="8" fill="#FFF8F0" stroke="#1A1410" stroke-width="2"/>
