  <line x1="620" y1="470" x2="400" y2="520" stroke="#1A1410" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="240" y="520" width="320" height="50" rx="8" fill="#E8F0E4" stroke="#1A1410" stroke-width="2"/>
